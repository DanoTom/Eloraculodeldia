<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Esa puerta no existe · El Oráculo del Día</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#05040a" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/base.css" />

    <style>
      /* Página sin escena 3D: no vale la pena cargar three.js para un 404. */
      .lost {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-s);
        max-width: 42ch;
        margin-inline: auto;
        padding: var(--space-l) var(--space-s);
        text-align: center;
      }

      .lost__title {
        font-size: var(--step-4);
        text-wrap: balance;
      }

      .lost__title em {
        font-style: italic;
        color: var(--gold-soft);
      }

      .lost__lede {
        font-family: var(--font-serif);
        font-size: var(--step-1);
        font-style: italic;
        color: color-mix(in srgb, var(--text) 78%, transparent);
        text-wrap: pretty;
      }
    </style>
  </head>

  <body>
    <div class="veil" aria-hidden="true"></div>

    <main class="stage">
      <div class="lost">
        <p class="eyebrow">404</p>
        <h1 class="lost__title">Esa puerta <em>no existe</em></h1>
        <p class="lost__lede">
          El oráculo tiene una sola entrada, y no es esta.
        </p>
        <a class="btn" href="/">Volver al umbral</a>
      </div>
    </main>
  </body>
</html>
